name: Build and deploy ONYX45 OS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then echo 'ERROR: VITE_SUPABASE_URL is missing or empty'; exit 1; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo 'ERROR: VITE_SUPABASE_ANON_KEY is missing or empty'; exit 1; fi
          if [[ "$VITE_SUPABASE_URL" != https://*.supabase.co* ]]; then echo 'ERROR: VITE_SUPABASE_URL is not a valid Supabase https URL'; exit 1; fi
          if [[ "$VITE_SUPABASE_ANON_KEY" != sb_publishable_* && "$VITE_SUPABASE_ANON_KEY" != eyJ* ]]; then echo 'ERROR: VITE_SUPABASE_ANON_KEY is not a publishable or anon key'; exit 1; fi
          echo 'Supabase configuration format checks passed (values hidden).'
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /O45crm/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
